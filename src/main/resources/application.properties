spring.application.name=easytime_java

# ==================================
# CONEXIÓN A LA BASE DE DATOS
# ==================================
spring.datasource.url=jdbc:mysql://localhost:3306/bd_easytime
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ==================================
# DDL-Auto 'none' porque la DB ya existe
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ⭐ CORRECCIÓN DE COLUMNA ⭐
# Fuerza a Hibernate a respetar la capitalización exacta de las columnas (ID_PROVEDOR, CREATED_AT)
spring.jpa.properties.hibernate.globally_quoted_identifiers=true


# ==================================
# CONFIGURACIÓN DE THYMELEAF
# ==================================
# Deshabilita la caché de Thymeleaf para desarrollo
spring.thymeleaf.cache=false

spring.mvc.format.date=yyyy-MM-dd