<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Dashboard - EASYTIME</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body>

    <header>
        <h2>EASYTIME - Menú Principal</h2>
        <p>Bienvenido,
            <span sec:authentication="name">Usuario</span>.
            <a th:href="@{/logout}">Cerrar Sesión</a>
        </p>
    </header>

    <div class="dashboard-grid">

        <a th:href="@{/citas/lista}" class="module-card">
            <div class="icon">📅</div>
            <h3>Gestión de Citas</h3>
        </a>

        <a th:href="@{/servicios}" class="module-card">
            <div class="icon">🛠️</div>
            <h3>Catálogo de Servicios</h3>
        </a>

        <a th:href="@{/inventarios}" class="module-card" sec:authorize="hasRole('ADMINISTRADOR')">
            <div class="icon">📦</div>
            <h3>Inventario</h3>
        </a>

        <a th:href="@{/productos}" class="module-card">
            <div class="icon">🏷️</div>
            <h3>Productos</h3>
        </a>

        <a th:href="@{/usuarios}" class="module-card" sec:authorize="hasRole('ADMINISTRADOR')">
            <div class="icon">👥</div>
            <h3>Lista de Usuarios</h3>
        </a>

        </div>

</body>

</html>
