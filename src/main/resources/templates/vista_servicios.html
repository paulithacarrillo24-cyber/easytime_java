<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Reporte de Servicios</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body class="container mt-4">

    <h2 class="mb-4">Reporte de Servicios</h2>

    <!-- Filtros para la consulta -->
    <form method="get" action="/vista_servicios" class="mb-4">
        <div class="row g-3 align-items-stretch">

            <!-- Card 1: Filtro por Nombre -->
            <div class="col-md-4">
                <div class="card border-secondary h-100">
                    <div class="card-header bg-secondary text-white">
                        Filtro por Nombre
                    </div>
                    <div class="card-body d-flex flex-column justify-content-between">
                        <label for="nombre" class="form-label">Nombre</label>
                        <div class="input-group">
                            <input type="text" name="nombre" id="nombre" class="form-control" th:value="${nombre}">
                            <button type="button" class="btn btn-outline-secondary" title="Limpiar"
                                onclick="document.getElementById('nombre').value = ''">
                                <i class="bi bi-x-circle"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Card 2: Filtro por Fecha de Creación -->
            <div class="col-md-4">
                <div class="card border-secondary h-100">
                    <div class="card-header bg-secondary text-white">
                        Filtro por Fecha de Creación
                    </div>
                    <div class="card-body">
                        <div class="row g-2">
                            <!-- Campo Desde con botón limpiar -->
                            <div class="col-6">
                                <label for="desde" class="form-label">Desde</label>
                                <div class="input-group">
                                    <input type="date" name="desde" id="desde" class="form-control" th:value="${desde}">
                                    <button type="button" class="btn btn-outline-secondary" title="Limpiar"
                                        onclick="document.getElementById('desde').value = ''">
                                        <i class="bi bi-x-circle"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Campo Hasta con botón limpiar -->
                            <div class="col-6">
                                <label for="hasta" class="form-label">Hasta</label>
                                <div class="input-group">
                                    <input type="date" name="hasta" id="hasta" class="form-control" th:value="${hasta}">
                                    <button type="button" class="btn btn-outline-secondary" title="Limpiar"
                                        onclick="document.getElementById('hasta').value = ''">
                                        <i class="bi bi-x-circle"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Card 3: Acción -->
            <div class="col-md-4">
                <div class="card border-secondary h-100">
                    <div class="card-header bg-secondary text-white text-center">
                        Acción
                    </div>
                    <div class="card-body d-flex justify-content-center align-items-center">
                        <button type="submit" class="btn btn-primary w-75">
                            <i class="bi bi-search me-2"></i> Filtrar
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </form>

    <!-- Tabla de resultados -->
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>Código de barras</th>
                <th>Nombre</th>
                <th>Duración</th>
                <th>Estado</th>
                <th>Descripción</th>
                <th>Precio</th>
                <th>Fecha de creación</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="s : ${servicios}">
                <td th:text="${s.ID_SERVICIO}"></td>
                <td th:text="${s.NOM_SERV}"></td>
                <td th:text="${s.DURACION_SERV}"></td>
                <td th:text="${s.EST_SERV}"></td>
                <td th:text="${s.DESCP_SERV}"></td>
                <td th:text="${s.PRECIO_SERV}"></td>
                <td th:text="${s.CREATED_AT}"></td>
            </tr>
        </tbody>
    </table>

    <!-- Botón descargar PDF -->
    <a th:href="@{/reporte_servicios(nombre=${nombre}, desde=${desde}, hasta=${hasta})}" class="btn btn-primary mt-3">
        Descargar PDF
    </a>
</body>
</html>
