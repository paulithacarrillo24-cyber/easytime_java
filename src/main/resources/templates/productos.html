<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Productos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/productos.css}"> 
</head>
<body class="bg-light">

    <div class="container mt-5">
        <h2 class="mb-4 text-secondary">Gestión de Productos</h2>

        <a th:href="@{/productos/nuevo}" class="btn btn-secondary mb-3">
            <i class="bi bi-plus-circle-fill"></i> Nuevo Producto
        </a>

        <div th:if="${#lists.isEmpty(productos)}" class="alert alert-info">
            No hay productos registrados.
        </div>

        <div th:unless="${#lists.isEmpty(productos)}" class="table-responsive shadow">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-primary"> 
                    <tr>
                        <th>ID</th>
                        <th>Código</th>
                        <th>Nombre</th>
                        <th>Descripción</th> 
                        <th>Precio</th>
                        <th>Cantidad</th>
                        <th>Caducidad</th>
                        <th>Ítem Inventario</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="prod : ${productos}">
                        <td th:text="${prod.idProducto}">1</td>
                        
                        <td th:text="${prod.codigo}">PROD-001</td>
                        
                        <td th:text="${prod.nombre}">Nombre del Producto</td>
                        
                        <td th:text="${prod.descripcion}">Descripción corta del producto.</td>
                        
                        <td th:text="${'$' + prod.precio}">$15.50</td>
                        
                        <td th:text="${prod.cantidad}">100</td>
                        
                        <td th:text="${#temporals.format(prod.caducidad, 'yyyy-MM-dd')}">2025-12-31</td>
                        
                        <td th:text="${prod.inventario.nombreProdInve}">Cera Líquida (ID: 5)</td>
                        
                        <td>
                            <div class="d-flex gap-2">
                                <a th:href="@{/productos/editar/{id}(id=${prod.idProducto})}" class="btn btn-sm btn-outline-primary" title="Editar">
                                    <i class="bi bi-pencil"></i>
                                </a>

                                <form th:action="@{/productos/eliminar/{id}(id=${prod.idProducto})}" 
                                      method="post" 
                                      style="display: inline;">
                                    
                                    <button type="submit" 
                                            class="btn btn-sm btn-outline-danger" 
                                            title="Eliminar" 
                                            onclick="return confirm('¿Está seguro de que desea eliminar este producto?');">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <a href="/" class="btn btn-secondary mt-3">
            <i class="bi bi-house-door"></i> Volver al Dashboard
        </a>
    </div>

</body>
</html>
