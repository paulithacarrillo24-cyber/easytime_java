<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de Productos</title>
    
    <link rel="stylesheet" th:href="@{/productos.css}">
    
</head>
<body>

<h1>Listado de Productos</h1>

<div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

<p><a th:href="@{/productos/nuevo}">➕ **Crear Nuevo Producto**</a></p>

<table>
    <thead>
    <tr>
        <th scope="col">ID</th>
        <th scope="col">Código</th>
        <th scope="col">Nombre</th>
        <th scope="col">Descripción</th>
        <th scope="col">Caducidad</th>
        <th scope="col">Precio</th>
        <th scope="col">Cantidad</th>
        <th scope="col">Inventario</th>
        <th scope="col">Fecha Creado</th>
        <th scope="col">Última Actualización</th>
        <th scope="col">Acciones</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="p : ${productos}">
        <td th:text="${p.idProducto}"></td>
        <td th:text="${p.codigo}"></td>
        <td th:text="${p.nombre}"></td>
        <td th:text="${p.descripcion}"></td>
        
        <td th:text="${p.caducidad != null ? #temporals.format(p.caducidad, 'dd-MM-yyyy') : 'N/A'}"></td>
        
        <td th:text="${#numbers.formatDecimal(p.precio, 1, 'POINT', 2, 'COMMA')} + ' USD'"></td>
        
        <td th:text="${p.cantidad}"></td>
        
        <td th:text="${p.inventario != null ? p.inventario.nombreProdInve : 'Sin asignar'}"></td>
        
        <td th:text="${p.createdAt != null ? #temporals.format(p.createdAt, 'dd-MM-yyyy HH:mm') : 'N/A'}"></td>
        <td th:text="${p.updatedAt != null ? #temporals.format(p.updatedAt, 'dd-MM-yyyy HH:mm') : 'N/A'}"></td>
        
        <td>
            <a th:href="@{/productos/editar/{id}(id=${p.idProducto})}">✏️ **Editar**</a>
            
            <a th:href="@{/productos/eliminar/{id}(id=${p.idProducto})}"
               th:onclick="|return confirm('¿Seguro que deseas eliminar el producto con ID ${p.idProducto}?')|"
            >🗑️ **Eliminar**</a>
        </td>
    </tr>
    </tbody>
</table>

<br>
<a href="/inventarios">**Ir a Listado de Inventarios**</a>

</body>
</html>
