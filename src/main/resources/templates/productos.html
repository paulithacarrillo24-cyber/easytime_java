<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Listado de Productos</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/productos.css}">
</head>

<body class="bg-light">
<div class="container mt-5">

    <div class="card shadow">

        <!-- ====== CABECERA ====== -->
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center">
                <button onclick="history.back()" class="btn btn-secondary text-white fw-bold me-3" title="Regresar">
                    <i class="bi bi-arrow-left"></i>
                </button>
                <h3 class="m-0">Lista de Productos</h3>
            </div>

            <div class="d-flex">
                <!-- Nuevo Producto solo visible para ADMINISTRADOR -->
                <a th:href="@{/productos/nuevo}" class="btn btn-light text-primary fw-bold"
                   sec:authorize="hasRole('ADMINISTRADOR')">
                    + Nuevo Producto
                </a>
            </div>
        </div>
        <!-- /cabecera -->

        <div class="card-body">

            <!-- ALERTA -->
            <div th:if="${param.guardado}" class="alert alert-success alert-dismissible fade show" role="alert">
                ¡Producto guardado exitosamente!
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- FILTRO -->
            <div class="card shadow-sm p-3 mb-4">
                <form th:action="@{/productos}" method="get" class="row g-2 align-items-center">

                    <div class="col-md-6">
                        <input type="search" name="q" class="form-control"
                               placeholder="Buscar producto (código, nombre, descripción, inventario...)"
                               th:value="${param.q}">
                    </div>

                    <div class="col-md-2 d-flex gap-2">
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-search"></i> Buscar
                        </button>

                        <a th:href="@{/productos}" class="btn btn-secondary w-100" title="Limpiar filtro">
                            <i class="bi bi-x-circle"></i>
                        </a>
                    </div>

                    <!-- PDF solo visible para ADMINISTRADOR -->
                    <div class="col-12 d-flex justify-content-end mt-2" sec:authorize="hasRole('ADMINISTRADOR')">
                        <a th:href="@{/productos/pdf(q=${q})}" class="btn btn-danger">
                            <i class="bi bi-filetype-pdf"></i> Descargar PDF
                        </a>
                    </div>

                </form>
            </div>
            <!-- /filtro -->

            <!-- TABLA -->
            <div th:if="${#lists.isEmpty(productos)}" class="alert alert-info">
                No hay productos registrados.
            </div>

            <div th:unless="${#lists.isEmpty(productos)}" class="table-responsive">
                <table class="table table-bordered table-hover table-striped text-center align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Código</th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Precio</th>
                            <th>Cantidad</th>
                            <th>Caducidad</th>
                            <th>Ítem</th>
                            <!-- Acciones solo para ADMINISTRADOR -->
                            <th sec:authorize="hasRole('ADMINISTRADOR')">Acciones</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr th:each="prod : ${productos}">
                            <td th:text="${prod.idProducto}"></td>
                            <td th:text="${prod.codigo}"></td>
                            <td th:text="${prod.nombre}"></td>
                            <td th:text="${prod.descripcion}"></td>

                            <td th:text="${'$' + #numbers.formatDecimal(prod.precio, 1, 'POINT', 2, 'COMMA')}"></td>
                            <td th:text="${prod.cantidad}"></td>
                            <td th:text="${#temporals.format(prod.caducidad, 'dd-MM-yyyy')}"></td>
                            <td th:text="${prod.inventario != null ? prod.inventario.nombreProdInve : '-'}"></td>

                            <!-- Acciones solo para ADMINISTRADOR -->
                            <td sec:authorize="hasRole('ADMINISTRADOR')">
                                <a class="btn btn-warning btn-sm me-2"
                                   th:href="@{/productos/editar/{id}(id=${prod.idProducto})}">
                                    <i class="bi bi-pencil-square"></i> Editar
                                </a>

                                <form th:action="@{/productos/eliminar/{id}(id=${prod.idProducto})}"
                                      method="post" style="display:inline;"
                                      onsubmit="return confirm('¿Seguro que deseas eliminar este producto?');">
                                    <button type="submit" class="btn btn-danger btn-sm">
                                        <i class="bi bi-trash"></i> Eliminar
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <!-- /tabla -->

            <!-- Para usuarios estándar -->
            <a th:href="@{/dashboard/usuario}" 
               class="btn btn-secondary mt-3" 
               sec:authorize="hasRole('USUARIO')">
                <i class="bi bi-house-door"></i> Volver al Dashboard
            </a>

            <!-- Para administradores -->
            <a th:href="@{/dashboard}" 
               class="btn btn-secondary mt-3" 
               sec:authorize="hasRole('ADMINISTRADOR')">
                <i class="bi bi-house-door"></i> Volver al Dashboard
            </a>

        </div>
        <!-- /card-body -->
    </div>
    <!-- /card -->

</div>
<!-- /container -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
