<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Listado de Usuarios</title>
    <link rel="stylesheet" th:href="@{/usuarios.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <!-- ====== CABECERA ====== -->
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center">
                <button onclick="history.back()" class="btn btn-secondary text-white fw-bold me-3" title="Regresar">
                    <i class="bi bi-arrow-left"></i>
                </button>
                <h3 class="m-0">Lista de Usuarios</h3>
            </div>

            <div class="d-flex">
                <!-- Nuevo Usuario solo visible para ADMINISTRADOR -->
                <a th:href="@{/usuarios/nuevo}" class="btn btn-light text-primary fw-bold"
                   sec:authorize="hasRole('ADMINISTRADOR')">
                    + Nuevo Usuario
                </a>
            </div>
        </div>
        <!-- /cabecera -->

        <div class="card-body">

            <!-- ALERTA -->
            <div th:if="${param.guardado}" class="alert alert-success alert-dismissible fade show" role="alert">
                ¡Usuario guardado exitosamente!
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- FILTRO (igual al de servicios) -->
            <div class="card shadow-sm p-3 mb-4">
                <form th:action="@{/usuarios}" method="get" class="row g-2 align-items-center">

                    <div class="col-md-6">
                        <input type="search" name="q" class="form-control"
                               placeholder="Buscar usuario (nombre, correo, documento, rol...)"
                               th:value="${q}">
                    </div>

                    <div class="col-md-2 d-flex gap-2">
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-search"></i> Buscar
                        </button>

                        <a th:href="@{/usuarios}" class="btn btn-secondary w-100" title="Limpiar filtro">
                            <i class="bi bi-x-circle"></i>
                        </a>
                    </div>

                    <!-- PDF solo visible para ADMINISTRADOR -->
                    <div class="col-12 d-flex justify-content-end mt-2" sec:authorize="hasRole('ADMINISTRADOR')">
                        <a th:href="@{/usuarios/pdf(q=${q})}" class="btn btn-danger">
                            <i class="bi bi-filetype-pdf"></i> Descargar PDF
                        </a>
                    </div>

                </form>
            </div>
            <!-- /filtro -->

            <!-- TABLA -->
            <div class="table-responsive">
                <table class="table table-bordered table-hover table-striped text-center align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Apellido</th>
                            <th>Correo</th>
                            <th>Estado</th>
                            <th>Tipo Doc</th>
                            <th>Documento</th>
                            <th>Rol</th>
                            <th>Teléfono</th>
                            <!-- Acciones solo para ADMINISTRADOR -->
                            <th sec:authorize="hasRole('ADMINISTRADOR')">Acciones</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr th:each="u : ${usuarios}">
                            <td th:text="${u.idUser}"></td>
                            <td th:text="${u.nomUser}"></td>
                            <td th:text="${u.apeUser}"></td>
                            <td th:text="${u.correoUser}"></td>

                            <td>
                                <span th:if="${u.estUser}" class="badge bg-success">Activo</span>
                                <span th:unless="${u.estUser}" class="badge bg-danger">Inactivo</span>
                            </td>

                            <td th:text="${u.tipoDoc != null ? u.tipoDoc.getDescripcion() : 'N/A'}"></td>
                            <td th:text="${u.numeroDoc}"></td>
                            <td th:text="${u.rol != null ? u.rol.nomRol : 'Sin Asignar'}"></td>
                            <td th:text="${u.telUser}"></td>

                            <!-- Acciones solo para ADMINISTRADOR -->
                            <td sec:authorize="hasRole('ADMINISTRADOR')">
                                <a class="btn btn-warning btn-sm me-2"
                                   th:href="@{/usuarios/editar/{id}(id=${u.idUser})}">
                                    <i class="bi bi-pencil-square"></i> Editar
                                </a>

                                <a class="btn btn-danger btn-sm"
                                   th:href="@{/usuarios/eliminar/{id}(id=${u.idUser})}"
                                   onclick="return confirm('¿Estás seguro de que quieres eliminar a este usuario?')">
                                    <i class="bi bi-trash"></i> Eliminar
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <!-- /tabla -->

            <!-- PAGINACIÓN -->
            <nav th:if="${totalPages > 1}" aria-label="Page navigation" class="mt-3">
                <ul class="pagination justify-content-center">

                    <!-- Botón anterior -->
                    <li class="page-item" th:classappend="${page == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{/usuarios(page=${page-1}, q=${q})}" aria-label="Anterior">
                            <span aria-hidden="true">&laquo;</span>
                        </a>
                    </li>

                    <!-- Números de página -->
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages-1)}"
                        th:classappend="${i == page} ? 'active'">
                        <a class="page-link" th:href="@{/usuarios(page=${i}, q=${q})}" th:text="${i+1}"></a>
                    </li>

                    <!-- Botón siguiente -->
                    <li class="page-item" th:classappend="${page == totalPages-1} ? 'disabled'">
                        <a class="page-link" th:href="@{/usuarios(page=${page+1}, q=${q})}" aria-label="Siguiente">
                            <span aria-hidden="true">&raquo;</span>
                        </a>
                    </li>
                </ul>
            </nav>
            <!-- /paginación -->

            <!-- Para administradores -->
            <a th:href="@{/dashboard}" 
               class="btn btn-secondary mt-3" 
               sec:authorize="hasRole('ADMINISTRADOR')">
                <i class="bi bi-house-door"></i> Volver al Dashboard
            </a>

        </div>
        <!-- /card-body -->
    </div>
    <!-- /card -->

</div>
<!-- /container -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
