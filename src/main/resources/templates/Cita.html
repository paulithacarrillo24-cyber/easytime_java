<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar Cita - EasyTime</title>
    <link rel="stylesheet" href="Cita.css">
</head>

<body>

    <div class="container">
        <h2>Agendar una Cita</h2>

        <form id="citaForm">

            <label for="usuario">Usuario</label>
            <input type="number" id="usuario" placeholder="ID del usuario" required>

            <label for="servicio">Servicio</label>
            <select id="servicio" required>
                <option value="">Seleccione un servicio</option>
                <option value="1">Corte de Cabello</option>
                <option value="2">Manicure</option>
                <option value="3">Tinte</option>
            </select>

            <label>Fecha y hora de la cita:</label>
            <input type="datetime-local" name="fechaCita" required>


            <button type="submit">Reservar Cita</button>
        </form>
    </div>

</body>

</html>
