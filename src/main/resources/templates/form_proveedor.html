<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="${proveedor.idProveedor == null ? 'Crear Nuevo Proveedor' : 'Editar Proveedor'}">Formulario de
        Proveedor</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-success text-white">
                <h3
                    th:text="${proveedor.idProveedor == null ? 'Registrar Nuevo Proveedor' : 'Editar Proveedor ID: ' + proveedor.idProveedor}">
                    Formulario de Proveedor</h3>
            </div>

            <div class="card-body">

                <form
                    th:action="${proveedor.idProveedor == null} ? @{/proveedores/crear} : @{/proveedores/{id}/editar(id=${proveedor.idProveedor})}"
                    th:object="${proveedor}" method="post">

                    <input type="hidden" th:field="*{idProveedor}" />

                    <input type="hidden" th:field="*{createdAt}" />
                    <input type="hidden" th:field="*{updateAt}" />
                    <input type="hidden" th:field="*{estProv}" />

                    <div class="mb-3">
                        <label for="tipoDoc" class="form-label fw-bold">Tipo de Documento (*)</label>
                        <select th:field="*{tipoDoc}" id="tipoDoc" class="form-control" required>
                            <option value="">-- Seleccione un Tipo --</option>
                            <option value="NIT" th:selected="*{tipoDoc} == 'NIT'">NIT</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="numProv" class="form-label fw-bold">Número de Identificación (*)</label>
                        <input type="text" th:field="*{numProv}" id="numProv" class="form-control" required
                            placeholder="Ej: 900123456-7">
                    </div>

                    <div class="mb-3">
                        <label for="nomProv" class="form-label fw-bold">Nombre/Razón Social (*)</label>
                        <input type="text" th:field="*{nomProv}" id="nomProv" class="form-control" required
                            placeholder="Ej: Distribuidora de Limpieza SAS">
                    </div>

                    <div class="mb-3">
                        <label for="telProv" class="form-label fw-bold">Teléfono</label>
                        <input type="text" th:field="*{telProv}" id="telProv" class="form-control"
                            placeholder="Ej: 6015551234">
                    </div>

                    <hr />

                    <div class="d-flex justify-content-between align-items-center">

                        <button type="button" onclick="history.back()" class="btn btn-secondary"
                            title="Regresar a la lista">
                            <i class="bi bi-arrow-left"></i> Regresar
                        </button>

                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-person-fill-gear"></i>
                            <span
                                th:text="${proveedor.idProveedor == null ? 'Crear Proveedor' : 'Guardar Cambios'}">Guardar</span>
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>

</body>

</html>
