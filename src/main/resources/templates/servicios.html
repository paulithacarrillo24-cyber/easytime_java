<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de Servicios</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">
        
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            
            <div class="d-flex align-items-center">
                
                <button onclick="history.back()" class="btn btn-secondary text-white fw-bold me-3" title="Regresar">
                    <i class="bi bi-arrow-left"></i> 
                </button>
                
                <h3 class="m-0">Lista de Servicios</h3>
            </div>
            
            <div class="d-flex">
                <a th:href="@{/servicios/nuevo}" class="btn btn-light text-primary fw-bold">
                    + Nuevo Servicio
                </a>
            </div>
            
        </div>
        <div class="card-body">
            
            <div th:if="${param.guardado}" class="alert alert-success alert-dismissible fade show" role="alert">
                ¡Servicio guardado exitosamente!
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            
            <table class="table table-bordered table-hover table-striped text-center align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Código</th>
                        <th>Nombre</th>
                        <th>Duración</th>
                        <th>Estado</th>
                        <th>Descripción</th>
                        <th>Precio</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="s : ${servicios}">
                        <td th:text="${s.idServicio}"></td> 
                        <td th:text="${s.nomServ}"></td> 
                        <td th:text="${s.duracionServ}"></td> 
                        
                        <td>
                            <span th:if="${s.estServ}" class="badge bg-success">Activo</span>
                            <span th:unless="${s.estServ}" class="badge bg-danger">Inactivo</span>
                        </td>
                        
                        <td th:text="${s.descpServ}"></td> 
                        <td th:text="${s.precioServ}"></td> 
                        
                        <td>
                            <a class="btn btn-warning btn-sm" th:href="@{/servicios/editar/{id}(id=${s.idServicio})}">Editar</a>
                            <a class="btn btn-danger btn-sm" th:href="@{/servicios/eliminar/{id}(id=${s.idServicio})}" onclick="return confirm('¿Seguro que deseas eliminar este servicio?')">Eliminar</a>
                        </td>
                    </tr>
                </tbody>

            </table>
            
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
