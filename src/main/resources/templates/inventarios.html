<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de Inventarios</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">
        
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            
            <div class="d-flex align-items-center">
                
                <button onclick="history.back()" class="btn btn-secondary text-white fw-bold me-3" title="Regresar a la página anterior">
                    <i class="bi bi-arrow-left"></i> 
                </button>
                
                <h3 class="m-0">Inventarios Registrados</h3>
            </div>
            
            <div class="d-flex">
                
                <a th:href="@{/inventarios/crear}" class="btn btn-light text-primary fw-bold me-3">
                    + Nuevo Inventario
                </a>
                
                <a th:href="@{/productos}" class="btn btn-info text-white fw-bold">
                    Ver Productos
                </a>
            </div>
            
        </div>
        
        <div class="card-body">
            
            <table class="table table-bordered table-hover table-striped text-center align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nombre Prod Inve</th>
                        <th>Cantidad</th>
                        <th>Proveedor ID</th>
                        <th>Actualizado</th>
                        <th>Acciones</th> 
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="inv : ${inventarios}">
                        <td th:text="${inv.idInventario}"></td>
                        <td th:text="${inv.nombreProdInve}"></td>
                        <td th:text="${inv.cantidad}"></td>
                        
                        <td th:text="${inv.proveedorId}"></td>
                        <td th:text="${inv.updateAt}"></td>

                        <td>
                            <a class="btn btn-warning btn-sm me-2" th:href="@{/inventarios/{id}/editar(id=${inv.idInventario})}">
                                <i class="bi bi-pencil"></i> Editar
                            </a>

                            <form th:action="@{/inventarios/{id}/eliminar(id=${inv.idInventario})}"
                                  method="post" 
                                  style="display:inline;"
                                  onsubmit="return confirm('¿Está seguro de que desea eliminar este ítem del inventario?');">
                                <button type="submit" class="btn btn-danger btn-sm">
                                    <i class="bi bi-trash"></i> Eliminar
                                </button>
                            </form>
                        </td>
                        </tr>
                </tbody>
            </table>
            
        </div>
    </div>
</div>

</body>
</html>
