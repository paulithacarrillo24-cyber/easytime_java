<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Login - Easy Time</title>
    <!-- Asumiendo que usas Bootstrap en el proyecto para estilos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h2 class="card-title text-center mb-4">Iniciar Sesión</h2>
                        
                        <!-- ⭐ MENSAJE DE ADVERTENCIA PARA EL CARRITO -->
                        <div th:if="${loginMessage}" class="alert alert-warning text-center mb-3">
                            <i class="bi bi-exclamation-triangle-fill"></i>
                            <span th:text="${loginMessage}"></span>
                        </div>
                        
                        <!-- MENSAJE DE ERROR ESTÁNDAR (credenciales incorrectas) -->
                        <div th:if="${param.error}" class="alert alert-danger">
                            Usuario o contraseña incorrectos.
                        </div>
                        
                        <!-- MENSAJE DE CIERRE DE SESIÓN -->
                        <div th:if="${param.logout}" class="alert alert-success">
                            Sesión cerrada correctamente.
                        </div>

                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label for="username" class="form-label">Usuario:</label>
                                <input type="text" id="username" name="username" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Contraseña:</label>
                                <input type="password" id="password" name="password" class="form-control" required>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">Iniciar sesión</button>
                        </form>

                        <p class="mt-4 text-center">
                            ¿No tienes cuenta?
                            <a th:href="@{/register}">
                                Regístrate aquí
                            </a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
