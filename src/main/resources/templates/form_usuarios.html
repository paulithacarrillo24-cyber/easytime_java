<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${usuario.idUser == null ? 'Crear Nuevo Usuario' : 'Editar Usuario'}">📝Formulario de Usuario</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/usuarios.css}">
    <style>
        /* Estilos específicos para el formulario */
        .form-group {
            margin-bottom: 25px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            color: #444;
            margin-bottom: 8px;
            font-size: 15px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #dcdcdc;
            border-radius: 6px;
            box-sizing: border-box; 
            font-size: 15px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.25);
            outline: none;
        }

        /* Estilos para el contenedor del formulario para darle un "marco" */
        .form-card {
            padding: 30px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.05);
            background-color: #ffffff;
            margin-top: 20px;
        }

        /* Estilos para los botones de acción */
        .form-actions {
            display: flex;
            justify-content: flex-start;
            gap: 15px;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        
        .btn-cancel {
            background-color: #6c757d; 
        }
        .btn-cancel:hover {
            background-color: #5a6268;
        }
        
        .btn-save {
             background-color: #007bff;
             color: white;
             padding: 12px 25px;
             border-radius: 5px;
             text-decoration: none;
             font-weight: 600;
             transition: background-color 0.3s ease, transform 0.1s;
             border: none;
             cursor: pointer;
        }
        .btn-save:hover {
            background-color: #0056b3;
            transform: translateY(-1px);
        }

        /* Layout responsivo para el grid del formulario */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }
        /* Ajuste para que el botón Cancelar también use el estilo de enlace */
        .form-actions a {
            display: inline-block;
            text-align: center;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <h1 th:text="${usuario.idUser == null ? 'Crear Nuevo Usuario' : 'Editar Usuario'}">Formulario de Usuario</h1>

        <div class="form-card">
            <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">
                
                <!-- ID OCULTO: NECESARIO PARA QUE EL CONTROLADOR SEPA QUE ES UNA ACTUALIZACIÓN -->
                <input type="hidden" th:field="*{idUser}" />
                
                <div class="form-grid">
                    
                    <div class="form-group">
                        <label for="nomUser">Nombre:</label>
                        <input type="text" id="nomUser" th:field="*{nomUser}" required />
                    </div>
                    
                    <div class="form-group">
                        <label for="apeUser">Apellido:</label>
                        <input type="text" id="apeUser" th:field="*{apeUser}" required />
                    </div>
                    
                    <div class="form-group">
                        <label for="correoUser">Correo:</label>
                        <input type="email" id="correoUser" th:field="*{correoUser}" required />
                    </div>

                    <div class="form-group">
                        <label for="numeroDoc">Documento:</label>
                        <input type="text" id="numeroDoc" th:field="*{numeroDoc}" required />
                    </div>

                    <div class="form-group">
                        <label for="tipoDoc">Tipo Doc:</label>
                        <select id="tipoDoc" th:field="*{tipoDoc}" required>
                            <option value="">Seleccione Tipo</option>
                            <option th:each="td : ${T(com.easytime_java.model.TipoDocumento).values()}"
                                    th:value="${td.codigo}"
                                    th:text="${td.descripcion}">
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="telUser">Teléfono:</label>
                        <input type="text" id="telUser" th:field="*{telUser}" required />
                    </div>

                    <!-- CAMPO DE ADMINISTRACIÓN: ESTADO -->
                    <div class="form-group">
                        <label for="estUser">Estado:</label>
                        <select id="estUser" th:field="*{estUser}" required>
                            <option th:value="true" th:text="Activo"></option>
                            <option th:value="false" th:text="Inactivo"></option>
                        </select>
                    </div>
                    
                    <!-- CAMPO DE ADMINISTRACIÓN: ROL (CORREGIDO) -->
                    <div class="form-group">
                        <label for="rol">Rol:</label>
                        <select id="rol" th:field="*{rol}" required> 
                            <option value="">Seleccione Rol</option>
                            <option th:each="r : ${roles}" 
                                    th:value="${r.idRol}"  
                                    th:text="${r.nomRol}">
                            </option>
                        </select>
                    </div>

                    <!-- CAMPO DE CONTRASEÑA: DEJAR VACÍO PARA NO CAMBIAR -->
                    <div class="form-group">
                        <label for="password">Contraseña (Dejar vacío para no cambiar):</label>
                        <input type="password" id="password" th:field="*{password}" 
                               th:required="${usuario.idUser == null}" />
                    </div>

                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-save" 
                            th:text="${usuario.idUser == null ? 'Crear Usuario' : 'Actualizar Usuario'}">Guardar Usuario</button>
                    <a th:href="@{/usuarios}" class="btn-save btn-cancel">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
