<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${usuario.idUser == null ? 'Crear Nuevo Usuario' : 'Editar Usuario'}">Formulario de Usuario</title>
    <link rel="stylesheet" th:href="@{/css/usuarios.css}">
</head>
<body>
    <div class="container">
        <h1 th:text="${usuario.idUser == null ? 'Crear Nuevo Usuario' : 'Editar Usuario'}">Formulario de Usuario</h1>

        <div class="form-card">
            <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">
                <input type="hidden" th:field="*{idUser}" />

                <div class="form-grid">
                    <div class="form-group">
                        <label for="nomUser">Nombre:</label>
                        <input type="text" id="nomUser" th:field="*{nomUser}" required />
                    </div>

                    <div class="form-group">
                        <label for="apeUser">Apellido:</label>
                        <input type="text" id="apeUser" th:field="*{apeUser}" required />
                    </div>

                    <div class="form-group">
                        <label for="correoUser">Correo:</label>
                        <input type="email" id="correoUser" th:field="*{correoUser}" required />
                    </div>

                    <div class="form-group">
                        <label for="numeroDoc">Documento:</label>
                        <input type="text" id="numeroDoc" th:field="*{numeroDoc}" required />
                    </div>

                    <div class="form-group">
                        <label for="tipoDoc">Tipo Doc:</label>
                        <select id="tipoDoc" th:field="*{tipoDoc}" required>
                            <option value="">Seleccione Tipo</option>
                            <option th:each="td : ${T(com.easytime_java.model.Usuario.TipoDocumento).values()}"
                                    th:value="${td}" th:text="${td}">
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="telUser">Teléfono:</label>
                        <input type="text" id="telUser" th:field="*{telUser}" required />
                    </div>

                    <div class="form-group">
                        <label for="estUser">Estado:</label>
                        <select id="estUser" th:field="*{estUser}" required>
                            <option th:value="true" th:text="Activo"></option>
                            <option th:value="false" th:text="Inactivo"></option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="rol">Rol:</label>
                        <select id="rol" th:field="*{rol}" required>
                            <option value="">Seleccione Rol</option>
                            <option th:each="r : ${roles}" th:value="${r.idRol}" th:text="${r.nomRol}"></option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña (Dejar vacío para no cambiar):</label>
                        <input type="password" id="password" th:field="*{password}" th:required="${usuario.idUser == null}" />
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-save"
                            th:text="${usuario.idUser == null ? 'Crear Usuario' : 'Actualizar Usuario'}">Guardar Usuario</button>
                    <a th:href="@{/usuarios}" class="btn-save btn-cancel">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
