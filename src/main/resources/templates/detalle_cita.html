<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalle de la Cita</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Detalle de la Cita</h4>
        </div>

        <div class="card-body">

            <p><strong>ID Cita:</strong> <span th:text="${cita.idCita}"></span></p>

            <p><strong>Estado:</strong> 
                <span th:text="${cita.estCita}"></span>
            </p>

            <p><strong>Fecha y Hora:</strong> 
                <span th:text="${#temporals.format(cita.fechaCita, 'yyyy-MM-dd HH:mm')}"></span>
            </p>

            <p><strong>Creada en:</strong> 
                <span th:text="${#temporals.format(cita.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
            </p>

            <p><strong>Última actualización:</strong> 
                <span th:text="${#temporals.format(cita.updateAt, 'yyyy-MM-dd HH:mm')}"></span>
            </p>

            <p><strong>ID Usuario:</strong> 
                <span th:text="${cita.usuarioIdUsuario}"></span>
            </p>

            <p><strong>ID Servicio:</strong> 
                <span th:text="${cita.servicioIdServicio}"></span>
            </p>

            <div class="mt-4">
                <a href="/citas" class="btn btn-secondary">Volver</a>
            </div>

        </div>
    </div>

</div>

</body>
</html>
