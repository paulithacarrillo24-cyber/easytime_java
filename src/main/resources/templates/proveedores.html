<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Lista de Proveedores</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body class="bg-light">

    <div class="container mt-5">
        <h2 class="mb-4 text-success">Gestión de Proveedores</h2>

        <a th:href="@{/proveedores/crear}" class="btn btn-success mb-3">
            <i class="bi bi-person-fill-add"></i> Nuevo Proveedor
        </a>

        <div th:if="${#lists.isEmpty(proveedores)}" class="alert alert-info">
            No hay proveedores registrados.
        </div>

        <div th:unless="${#lists.isEmpty(proveedores)}" class="table-responsive shadow">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nombre/Razón Social</th>
                        <th>Tipo Doc</th>
                        <th>Número Doc</th>
                        <th>Teléfono</th>
                        <th>Estado</th>
                        <th>Fecha Creación</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="prov : ${proveedores}">
                        <td th:text="${prov.idProveedor}">1</td>
                        <td th:text="${prov.nomProv}">Nombre Proveedor S.A.S.</td>
                        <td th:text="${prov.tipoDoc}">NIT</td>
                        <td th:text="${prov.numProv}">900123456</td>
                        <td th:text="${prov.telProv}">6015551234</td>
                        <td th:text="${prov.estProv == 1 ? 'Activo' : 'Inactivo'}">Activo</td>
                        <td th:text="${#temporals.format(prov.createdAt, 'yyyy-MM-dd HH:mm')}">2023-01-01 10:00</td>
                        
                        <td>
                            <div class="d-flex gap-2">
                                <a th:href="@{/proveedores/{id}/editar(id=${prov.idProveedor})}" class="btn btn-sm btn-outline-primary" title="Editar">
                                    <i class="bi bi-pencil"></i>
                                </a>

                                <form th:action="@{/proveedores/{id}/eliminar(id=${prov.idProveedor})}" method="post" onsubmit="return confirm('¿Está seguro de que desea eliminar a este proveedor?');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger" title="Eliminar">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <a href="/" class="btn btn-secondary mt-3">
            <i class="bi bi-house-door"></i> Volver al Inicio
        </a>
    </div>

</body>

</html>
