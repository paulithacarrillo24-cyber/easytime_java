<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="${inventario.idInventario == null ? 'Crear Nuevo Inventario' : 'Editar Inventario'}">Formulario de
        Inventario</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h3
                    th:text="${inventario.idInventario == null ? 'Registrar Nuevo Ítem de Inventario' : 'Editar Inventario ID: ' + inventario.idInventario}">
                    Formulario de Inventario</h3>
            </div>

            <div class="card-body">

                <form
                    th:action="${inventario.idInventario == null} ? @{/inventarios/crear} : @{/inventarios/{id}/editar(id=${inventario.idInventario})}"
                    th:object="${inventario}" method="post">

                    <input type="hidden" th:field="*{idInventario}" />

                    <input type="hidden" th:field="*{updateAt}" />


                    <div class="mb-3">
                        <label for="nombreProdInve" class="form-label fw-bold">Nombre del Producto</label>
                        <input type="text" th:field="*{nombreProdInve}" id="nombreProdInve" class="form-control"
                            required placeholder="Ej: Cera Líquida, Paño de Microfibra">
                    </div>

                    <div class="mb-3">
                        <label for="cantidad" class="form-label fw-bold">Cantidad en Stock</label>
                        <input type="text" th:field="*{cantidad}" id="cantidad" class="form-control" required min="0"
                            placeholder="Ej: 50">
                    </div>

                    <div class="mb-3">
                        <label for="proveedorId" class="form-label fw-bold">Proveedor</label>
                        <select th:field="*{proveedorId}" id="proveedorId" class="form-control" required>
                            <option value="">-- Seleccione un Proveedor --</option>
                            <option 
                                th:each="prov : ${listaProveedores}" 
                                th:value="${prov.idProveedor}" 
                                th:text="${prov.nomProv}"
                                th:selected="${inventario.proveedorId == prov.idProveedor}"
                            >
                            </option>
                        </select>
                        <div class="form-text">Selecciona el proveedor asociado.</div>
                    </div>

                    <hr />

                    <div class="d-flex justify-content-between align-items-center">

                        <button type="button" onclick="history.back()" class="btn btn-secondary"
                            title="Regresar a la lista">
                            <i class="bi bi-arrow-left"></i>
                        </button>

                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-box-seam"></i>
                            <span
                                th:text="${inventario.idInventario == null ? 'Crear Inventario' : 'Guardar Cambios'}">Guardar</span>
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>

</body>

</html>
