<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Formulario de Cita</title>
</head>
<body>
    <form th:action="@{/citas}" th:object="${cita}" method="post">
        
        <input type="hidden" th:field="*{idCita}" />
        <input type="hidden" th:field="*{usuarioIdUsuario}" />

        <div>
            <label for="fechaCita">📅 Fecha y Hora:</label>
            <input type="datetime-local" id="fechaCita" th:field="*{fechaCita}" required />
        </div>
        <br>

        <div>
            <label for="estCita">Estado de la Cita (Marcar para Activa):</label>
            <input type="checkbox" id="estCita" th:field="*{estCita}" />
        </div>
        <br>
        
        <div>
            <label for="servicio">⚙️ Seleccione el Servicio:</label>
            <select id="servicio" th:field="*{servicioIdServicio}" required>
                <option value="">-- Seleccionar Servicio --</option>
                
                <option th:each="serv : ${servicios}" 
                        th:value="${serv.idServicio}" 
                        th:text="${serv.nomServ}"> 
                </option>
            </select>
        </div>
        <br>
        
        <div>
            <button type="submit">Guardar</button>
            <a th:href="@{/citas/lista}">Cancelar</a>
        </div>
    </form>
</body>
</html>
